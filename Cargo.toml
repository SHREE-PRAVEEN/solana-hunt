[package]
name = "solana-hunt"
version = "0.1.0"
edition = "2024"

[dependencies]

minreq            = { version = "2.11", features = ["https-rustls-probe", "json-using-serde"] }
tiny-bip39        = "1.0"
rand              = "0.8"
rand_chacha       = "0.3"
# Use v1.x — compatible with Rust 1.75 (v2 needs edition2024 deps)
ed25519-dalek     = "1"
sha2              = "0.10"
hmac              = "0.12"
bs58              = "0.4"
hex               = "0.4"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
crossbeam-channel = "0.5"
num_cpus          = "1"
 
[profile.release]
opt-level     = 3
codegen-units = 1
lto           = true
 












